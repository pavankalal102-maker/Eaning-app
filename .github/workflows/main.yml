name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-generate Native Android Project Setup
        run: |
          flutter create . --org com.boss --project-name earning_app --overwrite

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK with Universal Architecture & Signing
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64,android-x64 --split-per-abi=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
